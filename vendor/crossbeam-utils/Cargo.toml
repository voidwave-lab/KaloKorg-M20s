[package]
edition = "2021"
rust-version = "1.60"
name = "crossbeam-utils"
version = "0.8.23"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Utilities for concurrent programming"
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
nightly = []
std = []

[lib]
name = "crossbeam_utils"
path = "src/lib.rs"

[dependencies]

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
check-cfg = [
    "cfg(crossbeam_loom)",
    "cfg(crossbeam_sanitize)",
]

